name: Desktop App Build

# Builds the standalone Wails desktop app for macOS (Apple Silicon), Linux,
# and Windows. Each OS builds natively on its own runner — Wails' native
# webview chrome (WebKit/WebKitGTK/WebView2) cannot be cross-compiled from a
# single host, so this can't be done from a single machine the way the
# Docker image can.
on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: InfraEye-macOS-arm64
            bin_glob: build/bin/InfraEye.app
          - os: ubuntu-latest
            artifact_name: InfraEye-Linux
            bin_glob: build/bin/infraeye-desktop
          - os: windows-latest
            artifact_name: InfraEye-Windows-amd64
            bin_glob: build/bin/infraeye-desktop.exe

    runs-on: ${{ matrix.os }}

    # Hoisted to job level so the macOS signing steps can gate on `env.X != ''`.
    # Secrets can't be referenced from a step-level `if:` directly, and without
    # these set the build still succeeds — it just produces the same ad-hoc
    # signed app as before, so forks and PR builds are unaffected.
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # macos-latest runners ship with ~14GB free after OS/toolchain overhead,
      # most of which is preinstalled Xcode platforms/simulators and an Android
      # SDK this build never touches. hdiutil create needs scratch space on the
      # order of the .app bundle size to stage the compressed DMG, and as the
      # frontend has grown that pushed a build over the edge ("No space left on
      # device" from hdiutil, confirmed reproducible across reruns on the same
      # commit). Clearing these frees 10GB+ before the build even starts.
      # Leaves Xcode itself alone — codesign/notarytool need the active
      # toolchain, and pruning "other" Xcode versions risks removing the one
      # xcode-select actually points at.
      - name: Free up disk space (macOS)
        if: runner.os == 'macOS'
        run: |
          df -h /
          sudo rm -rf /Users/runner/Library/Android
          sudo rm -rf ~/Library/Developer/CoreSimulator
          sudo rm -rf ~/Library/Developer/Xcode/DerivedData
          df -h /

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux system dependencies (GTK/WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Determine version from tag
        shell: bash
        run: echo "APP_VERSION=${GITHUB_REF_NAME#desktop-v}" >> "$GITHUB_ENV"

      # wails.json's productVersion is what Wails templates into the bundle's
      # CFBundleShortVersionString / CFBundleVersion. It was pinned at 1.0.0, so
      # every release so far shipped a bundle claiming to be 1.0.0 regardless of
      # its tag. The version the app itself reports comes from the -X ldflag
      # below, so this was only ever visible in Finder's Get Info and to
      # anything reading the plist. Patch it from the tag so the two agree.
      # workflow_dispatch runs have no tag, so leave the file alone there.
      - name: Stamp bundle version from tag
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        working-directory: backend/cmd/desktop
        run: |
          set -euo pipefail
          python3 - "$APP_VERSION" <<'PY'
          import json, sys
          version = sys.argv[1]
          with open("wails.json") as f:
              cfg = json.load(f)
          cfg["info"]["productVersion"] = version
          with open("wails.json", "w") as f:
              # ensure_ascii=False keeps the © in the copyright line literal
              # instead of rewriting it as ©.
              json.dump(cfg, f, indent=2, ensure_ascii=False)
              f.write("\n")
          PY
          grep productVersion wails.json

      - name: Build frontend (desktop variant)
        working-directory: frontend
        env:
          VITE_API_URL: http://127.0.0.1:8073
          VITE_DESKTOP: 'true'
        run: |
          npm ci
          npm run build

      - name: Copy frontend build into embeddable location
        shell: bash
        run: |
          rm -rf backend/cmd/desktop/frontenddist
          mkdir -p backend/cmd/desktop/frontenddist
          cp -R frontend/dist/. backend/cmd/desktop/frontenddist/

      # NOTE: passing an explicit -platform flag (even one matching the
      # runner's own native arch) crashes Wails' bindings-generation step on
      # macOS with a go-m1cpu link error. Letting `wails build` use its own
      # native-platform default avoids that bug entirely, and since every
      # job here already runs on a runner matching the platform it targets,
      # no cross-compilation is actually needed.
      - name: wails build (macOS)
        if: runner.os == 'macOS'
        working-directory: backend/cmd/desktop
        env:
          # GitHub's macOS runners default to Xcode's newer linker, which
          # rejects some Go-produced object files ("unknown file type") —
          # force the classic linker to avoid it.
          CGO_LDFLAGS: -Wl,-ld_classic
        run: wails build -ldflags "-X main.appVersion=$APP_VERSION"

      # Everything from here to the staple step is what turns the app from
      # "ad-hoc signed, rejected by Gatekeeper, reported as damaged on a direct
      # download" into a notarized app that opens normally. Each step no-ops
      # when the signing secrets aren't configured.
      - name: Import Developer ID certificate (macOS)
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE_P12 != ''
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          # Random throwaway password — the keychain lives and dies with the runner.
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Default keychains re-lock after 5 minutes of idle, which lands in
          # the middle of a notarytool wait. 6h is well past any build.
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          CERT="$RUNNER_TEMP/certificate.p12"
          echo -n "$MACOS_CERTIFICATE_P12" | base64 --decode > "$CERT"
          security import "$CERT" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$CERT"

          # Without this, codesign blocks on a GUI "allow access" prompt that
          # nothing can answer on a headless runner.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          echo "Imported signing identities:"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Sign app with Developer ID (macOS)
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE_P12 != ''
        shell: bash
        working-directory: backend/cmd/desktop/build/bin
        run: |
          set -euo pipefail
          # --options runtime (hardened runtime) is mandatory for notarization,
          # and --timestamp gets a trusted timestamp so the signature stays
          # valid after the certificate itself expires.
          #
          # No --entitlements: the bundle is a single Go binary, and WKWebView's
          # JIT lives in the system-signed com.apple.WebKit.WebContent process,
          # which does not inherit ours. If a future build ever fails to launch
          # under the hardened runtime, that is the knob to reach for.
          codesign --force --deep --timestamp --options runtime \
            --sign "$MACOS_SIGNING_IDENTITY" InfraEye.app

          codesign --verify --deep --strict --verbose=2 InfraEye.app

      - name: wails build (Linux, webkit2gtk 4.1)
        if: runner.os == 'Linux'
        working-directory: backend/cmd/desktop
        run: wails build -platform linux/amd64 -tags webkit2_41 -ldflags "-X main.appVersion=$APP_VERSION"

      # makensis is NOT preinstalled on windows-latest (confirmed by a failed
      # run — `wails build -nsis` silently warns "makensis not found" and
      # falls back to just the bare .exe instead of failing outright).
      # Chocolatey is preinstalled, so grab it from there. choco updates the
      # machine PATH, but that doesn't propagate to later steps in the same
      # job on its own (confirmed by a second failed run) — GITHUB_PATH is
      # the mechanism Actions actually reads for that.
      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      # `-nsis` bundles the WebView2 bootstrapper and produces a
      # double-clickable Setup.exe instead of a bare binary.
      - name: wails build (Windows, NSIS installer)
        if: runner.os == 'Windows'
        working-directory: backend/cmd/desktop
        run: wails build -platform windows/amd64 -nsis -ldflags "-X main.appVersion=$env:APP_VERSION"

      - name: Package artifact (macOS .app -> .dmg)
        if: runner.os == 'macOS'
        working-directory: backend/cmd/desktop/build/bin
        run: |
          rm -rf dmg-staging
          mkdir dmg-staging
          # -R preserves the signature; a plain cp would strip the bundle's
          # extended attributes and invalidate it.
          cp -R InfraEye.app dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "InfraEye" -srcfolder dmg-staging -ov -format UDZO "${{ matrix.artifact_name }}.dmg"
          rm -rf dmg-staging

      # The ticket has to be stapled to the .dmg, not just the .app inside it:
      # a direct download hands the user the disk image, and Gatekeeper checks
      # the image before anything is copied out of it. Stapling means the app
      # opens even on a machine that is offline and can't reach Apple to
      # verify the ticket over the network.
      - name: Notarize and staple (macOS)
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE_P12 != '' && env.MACOS_NOTARY_KEY != ''
        shell: bash
        working-directory: backend/cmd/desktop/build/bin
        run: |
          set -euo pipefail
          DMG="${{ matrix.artifact_name }}.dmg"

          # Sign the disk image itself so it can't be tampered with after notarization.
          codesign --force --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$DMG"

          KEY="$RUNNER_TEMP/notary_key.p8"
          echo -n "$MACOS_NOTARY_KEY" | base64 --decode > "$KEY"
          # Make sure the key is shredded even if notarytool fails.
          trap 'rm -f "$KEY"' EXIT

          # --wait blocks until Apple returns a verdict; without it the step
          # would pass while notarization was still queued and we'd staple a
          # ticket that does not exist yet.
          xcrun notarytool submit "$DMG" \
            --key "$KEY" \
            --key-id "$MACOS_NOTARY_KEY_ID" \
            --issuer "$MACOS_NOTARY_ISSUER_ID" \
            --wait

          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

          # Final proof: assess the app the way Gatekeeper will on a user's
          # machine. Expect "accepted / source=Notarized Developer ID".
          hdiutil attach -nobrowse -readonly "$DMG" -mountpoint /tmp/infraeye-verify
          spctl -a -vvv -t exec /tmp/infraeye-verify/InfraEye.app
          hdiutil detach /tmp/infraeye-verify

      - name: Package artifact (Linux .deb)
        if: runner.os == 'Linux'
        working-directory: backend/cmd/desktop
        run: |
          set -e
          PKGROOT=build/bin/pkgroot
          rm -rf "$PKGROOT"
          mkdir -p "$PKGROOT/DEBIAN" "$PKGROOT/usr/bin" "$PKGROOT/usr/share/applications" "$PKGROOT/usr/share/icons/hicolor/1024x1024/apps"

          cp build/bin/infraeye-desktop "$PKGROOT/usr/bin/infraeye-desktop"
          chmod 0755 "$PKGROOT/usr/bin/infraeye-desktop"
          cp build/appicon.png "$PKGROOT/usr/share/icons/hicolor/1024x1024/apps/infraeye.png"

          printf '%s\n' \
            '[Desktop Entry]' \
            'Name=InfraEye' \
            'Comment=Agentless observability platform' \
            'Exec=/usr/bin/infraeye-desktop' \
            'Icon=infraeye' \
            'Terminal=false' \
            'Type=Application' \
            'Categories=Development;Monitor;' \
            > "$PKGROOT/usr/share/applications/infraeye.desktop"

          printf '%s\n' \
            'Package: infra-eye' \
            "Version: ${APP_VERSION}" \
            'Section: utils' \
            'Priority: optional' \
            'Architecture: amd64' \
            'Depends: libgtk-3-0, libwebkit2gtk-4.1-0' \
            'Maintainer: InfraEye <noreply@infraeye.local>' \
            'Description: Agentless observability platform — desktop app' \
            ' A fully self-contained native app for managing Linux servers and' \
            ' Kubernetes clusters. SQLite-backed, no Docker or Postgres required.' \
            > "$PKGROOT/DEBIAN/control"

          dpkg-deb --build --root-owner-group "$PKGROOT" "build/bin/${{ matrix.artifact_name }}.deb"
          rm -rf "$PKGROOT"

      # Arch has no apt/dpkg equivalent — pacman only installs its own
      # .pkg.tar.zst format, built via makepkg from a PKGBUILD. makepkg
      # refuses to run as root, so this builds inside an archlinux container
      # under a throwaway non-root user rather than needing an Arch runner.
      # Reuses the same binary the .deb above already packaged — no
      # recompile, since the ELF binary itself is distro-agnostic as long as
      # the runtime libs (gtk3, webkit2gtk) are present, which pacman's
      # depends= handles at install time.
      - name: Package artifact (Arch pkg.tar.zst)
        if: runner.os == 'Linux'
        working-directory: backend/cmd/desktop
        run: |
          set -e
          PKGDIR="$PWD/build/arch"
          rm -rf "$PKGDIR"
          mkdir -p "$PKGDIR"
          cp build/bin/infraeye-desktop "$PKGDIR/infraeye-desktop"
          cp build/appicon.png "$PKGDIR/appicon.png"

          printf '%s\n' \
            '[Desktop Entry]' \
            'Name=InfraEye' \
            'Comment=Agentless observability platform' \
            'Exec=/usr/bin/infraeye-desktop' \
            'Icon=infraeye' \
            'Terminal=false' \
            'Type=Application' \
            'Categories=Development;Monitor;' \
            > "$PKGDIR/infraeye.desktop"

          printf '%s\n' \
            'pkgname=infra-eye' \
            "pkgver=${APP_VERSION}" \
            'pkgrel=1' \
            'pkgdesc="Agentless observability platform — desktop app"' \
            "arch=('x86_64')" \
            'url="https://github.com/mnshchtri/infra-eye"' \
            "license=('MIT')" \
            "depends=('gtk3' 'webkit2gtk-4.1')" \
            "options=('!debug')" \
            "source=('infraeye-desktop' 'appicon.png' 'infraeye.desktop')" \
            "sha256sums=('SKIP' 'SKIP' 'SKIP')" \
            '' \
            'package() {' \
            '  install -Dm755 "$srcdir/infraeye-desktop" "$pkgdir/usr/bin/infraeye-desktop"' \
            '  install -Dm644 "$srcdir/appicon.png" "$pkgdir/usr/share/icons/hicolor/1024x1024/apps/infraeye.png"' \
            '  install -Dm644 "$srcdir/infraeye.desktop" "$pkgdir/usr/share/applications/infraeye.desktop"' \
            '}' \
            > "$PKGDIR/PKGBUILD"

          docker run --rm -v "$PKGDIR:/pkgbuild" archlinux:base-devel bash -c '
            set -e
            # Modern pacman sandboxes downloads via seccomp (DisableSandboxSyscalls,
            # off by default) which fails inside some container setups with
            # "error restricting syscalls via seccomp" — disable it rather than
            # depend on the host allowing that seccomp filter.
            sed -i "s/^#DisableSandboxSyscalls/DisableSandboxSyscalls/" /etc/pacman.conf
            pacman -Sy --noconfirm archlinux-keyring
            pacman -Syu --noconfirm --needed gtk3 webkit2gtk-4.1
            useradd -m builder
            chown -R builder /pkgbuild
            cd /pkgbuild
            su builder -c "makepkg -f --nosign"
          '

          BUILT=$(ls "$PKGDIR"/infra-eye-*.pkg.tar.zst | head -1)
          cp "$BUILT" "build/bin/${{ matrix.artifact_name }}.pkg.tar.zst"

      # The NSIS output filename isn't pinned by us (it's derived from
      # wails.json's productName), so find it by suffix instead of hardcoding
      # the exact name.
      - name: Package artifact (Windows installer)
        if: runner.os == 'Windows'
        working-directory: backend/cmd/desktop/build/bin
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Filter "*installer.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer (*installer.exe) not found in build/bin" }
          Copy-Item $installer.FullName "${{ matrix.artifact_name }}.exe"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            backend/cmd/desktop/build/bin/${{ matrix.artifact_name }}.dmg
            backend/cmd/desktop/build/bin/${{ matrix.artifact_name }}.deb
            backend/cmd/desktop/build/bin/${{ matrix.artifact_name }}.pkg.tar.zst
            backend/cmd/desktop/build/bin/${{ matrix.artifact_name }}.exe
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release with desktop binaries
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/InfraEye-macOS-arm64/InfraEye-macOS-arm64.dmg
            dist/InfraEye-Linux/InfraEye-Linux.deb
            dist/InfraEye-Linux/InfraEye-Linux.pkg.tar.zst
            dist/InfraEye-Windows-amd64/InfraEye-Windows-amd64.exe

  # Publishes packaging/aur/infraeye-bin to the AUR so Arch users get the new
  # version from `yay -S infraeye-bin` without anyone touching it by hand.
  # Runs after `release` because the PKGBUILD's sha256sum is computed from the
  # published .deb — the release assets have to exist first.
  #
  # Skipped entirely when AUR_SSH_PRIVATE_KEY isn't configured, so this never
  # blocks a release for anyone who hasn't set the AUR side up.
  publish-aur:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - name: Checkout
        if: env.AUR_SSH_PRIVATE_KEY != ''
        uses: actions/checkout@v4

      - name: Update PKGBUILD for the tagged release
        if: env.AUR_SSH_PRIVATE_KEY != ''
        working-directory: packaging/aur/infraeye-bin
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#desktop-v}"
          DEB_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/InfraEye-Linux.deb"

          # Hash the asset users will actually download, rather than trusting a
          # locally rebuilt copy to be byte-identical to it.
          curl -fsSL --retry 3 -o /tmp/InfraEye-Linux.deb "$DEB_URL"
          SHA256="$(sha256sum /tmp/InfraEye-Linux.deb | cut -d' ' -f1)"
          echo "version=$VERSION sha256=$SHA256"

          # pkgrel resets to 1 on every new pkgver; it only ever increments when
          # the packaging changes for an unchanged upstream version, which by
          # definition isn't what a release tag is.
          sed -i \
            -e "s/^pkgver=.*/pkgver=${VERSION}/" \
            -e "s/^pkgrel=.*/pkgrel=1/" \
            -e "s/^sha256sums=.*/sha256sums=('${SHA256}')/" \
            PKGBUILD

          # makepkg only exists on Arch, and it refuses to run as root, hence
          # the container plus an unprivileged user. --printsrcinfo doesn't
          # fetch sources, so this is just a parse and reformat.
          docker run --rm -v "$PWD:/pkg" archlinux:base-devel bash -c '
            useradd -m builder
            cp /pkg/PKGBUILD /home/builder/
            chown -R builder /home/builder
            su builder -c "cd /home/builder && makepkg --printsrcinfo"
          ' > .SRCINFO

          echo "--- PKGBUILD ---"; cat PKGBUILD
          echo "--- .SRCINFO ---"; cat .SRCINFO

          # A .SRCINFO that disagrees with the PKGBUILD is rejected by the AUR's
          # own hook, but only after the push — catch it here where the error is
          # readable.
          test "$(grep -c "pkgver = ${VERSION}$" .SRCINFO)" -eq 1
          test "$(grep -c "sha256sums = ${SHA256}$" .SRCINFO)" -eq 1

      - name: Publish to the AUR
        if: env.AUR_SSH_PRIVATE_KEY != ''
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#desktop-v}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur

          # Pinned rather than ssh-keyscan'd: trust-on-first-use in CI would
          # accept whatever key answers, which is exactly the case this guards
          # against. Fingerprint SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4
          # is the one the AUR publishes.
          echo 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes"

          git clone ssh://aur@aur.archlinux.org/infraeye-bin.git /tmp/aur
          cd /tmp/aur
          # A package that has never been pushed clones as an empty repo with no
          # branch checked out; git checkout -B handles both that and the normal case.
          git checkout -B master

          cp "$GITHUB_WORKSPACE/packaging/aur/infraeye-bin/PKGBUILD" .
          cp "$GITHUB_WORKSPACE/packaging/aur/infraeye-bin/.SRCINFO" .

          git config user.name "InfraEye Release Bot"
          git config user.email "mnshchtri@gmail.com"
          git add PKGBUILD .SRCINFO

          # Re-running a tag build with no packaging change would otherwise fail
          # the commit and take the job down with it.
          if git diff --cached --quiet; then
            echo "AUR package already matches ${VERSION}; nothing to push."
            exit 0
          fi

          git commit -m "infraeye-bin ${VERSION}-1"
          git push origin master
